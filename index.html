<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ThumbCode</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
:root{--bg:#111318;--pn:#1b1e25;--key:#2a2e38;--key2:#383d4a;--ac:#5b8cff;--tx:#e8e8ee;--mu:#8b8d99;--ok:#3fb868;--am:#e5a93c;--er:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#root{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;align-items:center;gap:6px;height:36px;padding:0 6px;flex:none}
#top .sp{display:none}#fn{color:var(--mu);font-size:13px;display:flex;min-width:0;overflow:hidden;white-space:nowrap}#fn .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}#fn .ex{flex:none}
button{font:inherit;color:var(--tx);background:var(--key);border:0;border-radius:8px;padding:0;cursor:pointer;touch-action:none}
.chip{padding:5px 10px;font-size:13px;white-space:nowrap}.chip.on{background:var(--ac)}
#run{background:var(--ok);color:#000;padding:5px 14px;font-size:13px;font-weight:600}#run.busy{background:var(--am)}
#app{flex:1;min-height:0;display:grid;gap:6px;padding:2px 6px 6px}
#app.split{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"kl ed kr"}
#app.wide{grid-template-columns:14fr 6fr 8fr;grid-template-areas:"ed kl kr"}
#app.wide.kbleft{grid-template-columns:6fr 8fr 14fr;grid-template-areas:"kl kr ed"}
#app.wide .kb.std,#app.stack .kb.std{width:100%}
#app.stack{grid-template-columns:6fr 8fr;grid-template-rows:1fr auto;grid-template-areas:"ed ed" "kl kr"}
#app.focus{grid-template-columns:1fr;grid-template-areas:"ed"}
#app.focus .kb{display:none}
#ed{grid-area:ed;position:relative;background:var(--pn);border-radius:10px;overflow:hidden;min-width:0;min-height:0;display:flex;flex-direction:column;-webkit-user-select:text;user-select:text}
#kl{grid-area:kl}#kr{grid-area:kr}
.kb{display:grid;grid-template-rows:repeat(5,1fr);gap:4px;min-height:0;min-width:0;-webkit-user-select:none;user-select:none;touch-action:none}
.row{display:flex;gap:4px;min-height:0}.row button{flex:1;min-width:0;font-size:clamp(14px,3.8vmin,22px)}
.row button.w{flex:2}.row button.s{background:var(--key2);font-size:clamp(11px,2.8vmin,15px)}
.row button.d,.row button.on{background:var(--ac)}
.pane{flex:1;min-height:0;display:none}.pane.show{display:block}
.CodeMirror{height:100%;font:var(--ef)/1.45 ui-monospace,Menlo,Consolas,monospace;background:transparent}
.CodeMirror-gutters{background:transparent;border:0}
#out{margin:0;padding:10px;overflow:auto;height:100%;font:var(--ef)/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
#out .m{color:var(--mu)}#out .g{color:var(--ok)}#out .a{color:var(--am)}#out .e{color:var(--er)}#out div{margin-bottom:8px}
#drawer{position:absolute;left:0;top:0;bottom:0;width:190px;background:#232733;padding:6px;display:none;z-index:5;overflow:auto}
#drawer .f{display:flex;align-items:center;padding:8px;border-radius:8px;font-size:14px}.f.cur{background:var(--key2)}.f span{flex:1;overflow:hidden;text-overflow:ellipsis}.f b{color:var(--mu);padding-left:8px}
#drawer .h{color:var(--mu);font-size:11px;padding:4px}#drawer .n{color:var(--ac);padding:8px;font-size:14px}
dialog{max-height:92vh;overflow:auto;background:#232733;color:var(--tx);border:0;border-radius:12px;padding:16px;max-width:90vw;width:340px}
dialog::backdrop{background:#0008}dialog input{width:100%;margin:6px 0 10px;padding:8px;border-radius:8px;border:1px solid var(--key2);background:var(--bg);color:var(--tx);font-size:15px;-webkit-user-select:text;user-select:text}
dialog .b{display:flex;gap:8px;justify-content:flex-end}dialog button{padding:8px 14px;touch-action:auto}dialog label{font-size:12px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:9}
#top{height:auto;min-height:36px;flex-wrap:wrap;row-gap:4px;padding:3px 6px}
#tabs{display:flex;gap:6px;order:3}#top .sp{order:4}#bUndo{order:5}#bRedo{order:6}#clip{order:7}#bLay{order:8}#bFull{order:9}#bPanel{order:10}#bSet{order:11}#run{order:12}
#bDrawer{order:1}#fn{order:2;flex:1 1 0;max-width:none}.brk{display:none;order:6}
#clip{display:flex;gap:4px}#clip .chip{padding:5px 8px;font-size:12px}
@media (max-width:800px){
 #fn{flex:1 1 0;max-width:none;order:2}#bLay{order:3}#bFull{order:4}#bPanel{order:5}#bSet{order:6}#run{order:7}
 .brk{display:block;order:8;flex-basis:100%;height:0}
 #tabs{order:9}#bUndo{order:10}#bRedo{order:11}#clip{order:12}#top .sp{display:none}
}
#drawer .f b{font-size:20px;line-height:1;padding:4px 12px;margin:-4px -6px -4px 0}
#drawer .f{min-height:40px}
.col{display:flex;flex-direction:column;gap:8px}
#toast{align-items:center;white-space:nowrap}#toast button{touch-action:auto;padding:5px 12px}
#app.split{grid-template-columns:auto 1fr auto}
:root{--sf:1;--cw:36px;--kw:36px;--kh:40px;--sh:30px;--kf:1;--ef:13px}
#kl{--cols:6}#kr{--cols:8}
.kb.std{display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:none;grid-auto-rows:var(--kh);gap:3px;align-content:end;align-self:end;width:min(calc(var(--cols)*var(--kw) + (var(--cols) - 1)*3px),48vw)}
.std button{display:flex;align-items:center;justify-content:center;position:relative;min-width:0;border-radius:6px;padding:0}
.std button.s{background:var(--key2)}.std button.d{background:var(--ac)}
.std i{font-style:normal;line-height:1;pointer-events:none}
.std i.a{font-size:calc(var(--cw)*.44*var(--kf))}.std button.s i.a{font-size:calc(var(--cw)*.34*var(--kf))}
.std i.b{position:absolute;top:2px;left:4px;font-size:max(7px,calc(var(--cw)*.25*var(--kf)));color:var(--mu)}
.sh .std i.a:not(.l){position:absolute;top:2px;left:4px;font-size:max(7px,calc(var(--cw)*.25*var(--kf)));color:var(--mu)}
.sh .std i.b{position:static;font-size:calc(var(--cw)*.44*var(--kf));color:var(--tx)}
.sh .std i.a.l,.caps .std i.a.l{text-transform:uppercase}.sh.caps .std i.a.l{text-transform:none}
.sh .std button[data-k=SHIFT],.caps .std button[data-k=CAPS]{background:var(--ac)}
button.sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;background:#242c42;color:#a9c1ff;font-size:max(6px,calc(var(--cw)*.3*var(--sf)));font-family:ui-monospace,Menlo,Consolas,monospace;border-radius:6px}
button.sn.d{background:var(--ac);color:#fff}
.snip{background:rgba(91,140,255,.30);border-radius:3px}
#sg{position:fixed;z-index:20;display:none;background:#232733;border:1px solid var(--key2);border-radius:8px;box-shadow:0 4px 14px #0008;padding:3px;gap:3px;-webkit-user-select:none;user-select:none;touch-action:none;font:13px ui-monospace,Menlo,Consolas,monospace}
#sg.list{flex-direction:column;min-width:120px}
#sg.blocks{flex-direction:row;flex-wrap:wrap;background:transparent;border:0;box-shadow:none;padding:0}
#sg b{font-weight:400;padding:7px 11px;border-radius:6px;background:var(--key);color:var(--tx);white-space:nowrap}
#sg.blocks b{background:#2f3547;box-shadow:0 2px 6px #0009}
#sg u{text-decoration:none;color:var(--ac);font-weight:700}
dialog select{width:100%;margin:6px 0 10px;padding:8px;border-radius:8px;border:1px solid var(--key2);background:var(--bg);color:var(--tx);font-size:15px}
#br{position:fixed;z-index:30;background:#1b1e25;display:flex;flex-direction:column;box-shadow:0 0 24px #000b;transition:transform .22s ease;padding-top:env(safe-area-inset-top)}
#br:not(.open){visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
#br.top{left:0;right:0;top:0;height:calc(var(--brs)*1%);transform:translateY(-104%)}
#br.left{top:0;bottom:0;left:0;width:calc(var(--brs)*1%);transform:translateX(-104%)}
#br.right{top:0;bottom:0;right:0;width:calc(var(--brs)*1%);transform:translateX(104%)}
#br.open{transform:none}
#brt{display:flex;gap:6px;padding:6px 6px 0;flex:none;align-items:center}#brt .sp2,.sp2{flex:1}#brt button{touch-action:auto}
#pnbody{flex:1;min-height:0;display:flex;flex-direction:column}
#br.top #pnbody{padding-bottom:26px}#br.left #pnbody{padding-right:26px}#br.right #pnbody{padding-left:26px}
.pv{display:none;flex:1;min-height:0;flex-direction:column}
#br[data-v=prob] #pvprob,#br[data-v=notes] #pvnotes,#br[data-v=board] #pvboard{display:flex}
#pvprob{overflow:auto}
#pcols{columns:400px 2;column-gap:10px;padding:6px}
.ps{break-inside:avoid;display:block;margin:0 0 10px;border:1px solid var(--key2);border-radius:10px;background:var(--bg)}
.ph{display:flex;align-items:center;gap:4px;padding:5px 6px;border-bottom:1px solid var(--key2);font-size:12px;color:var(--mu)}.ph b{flex:1;color:var(--tx);font-size:13px}
.mini{padding:3px 8px;font-size:12px;background:var(--key);border-radius:6px;touch-action:auto}
.pe{padding:10px;min-height:96px;outline:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);-webkit-user-select:text;user-select:text;overflow-wrap:anywhere}
.ps[data-k=st] .pe{min-height:190px}
.pe:empty:before{content:attr(data-ph);color:var(--mu)}
#pnTb{display:flex;gap:5px;padding:6px;flex:none;flex-wrap:wrap}#pnTb button{touch-action:auto}
#pNotes{flex:1;min-height:0;overflow:auto;margin:0 6px 6px;border:1px solid var(--key2);border-radius:8px;background:var(--bg)}
.pe h1,.pe h2,.pe h3,.pe h4{margin:.7em 0 .3em;line-height:1.25}.pe h1{font-size:1.4em}.pe h2{font-size:1.25em}.pe h3{font-size:1.1em}
.pe p{margin:.5em 0}.pe ul,.pe ol{margin:.4em 0;padding-left:1.4em}
.pe pre,.pe code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#232733;border-radius:6px}.pe code{padding:1px 5px}
.pe pre{padding:8px 10px;overflow:auto;white-space:pre-wrap;margin:.5em 0}.pe pre code{padding:0;background:none}
.pe table{border-collapse:collapse;margin:8px 0;max-width:100%}.pe td,.pe th{border:1px solid var(--key2);padding:4px 8px;vertical-align:top}
.pe img{max-width:100%;background:#fff;border-radius:4px}.pe a{color:var(--ac)}
.pe blockquote{border-left:3px solid var(--key2);margin:8px 0;padding-left:10px;color:#cfd0da}
#bdt{display:flex;gap:6px;padding:6px;flex:none;align-items:center;flex-wrap:wrap}#bdt button{touch-action:auto;padding:4px 9px;font-size:12px}
#bdc{display:flex;gap:6px;align-items:center}#bdc i{width:22px;height:22px;border-radius:50%;border:3px solid #0000;display:block;box-shadow:0 0 0 1px #fff3;touch-action:auto}#bdc i.on{border-color:var(--ac)}
#bdwrap{position:relative;flex:1;min-height:0;margin:0 6px 6px;border-radius:8px;overflow:hidden;background:#fff}
#bdwrap canvas{position:absolute;left:0;top:0;touch-action:none;-webkit-user-select:none;user-select:none}
#bdi{cursor:crosshair}
#bdcard{display:none;position:absolute;right:8px;top:8px;width:min(310px,calc(100% - 16px));background:#232733;border-radius:10px;padding:8px;box-shadow:0 6px 20px #000a;z-index:3;color:var(--tx)}
#bdcard .vrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#bdcard label{font-size:13px;display:flex;gap:5px;align-items:center;margin:0;color:var(--tx)}
#bdcard select{width:auto;margin:0;padding:5px;font-size:13px;flex:1}
#bdcard textarea{width:100%;margin:6px 0 2px;background:var(--bg);color:var(--tx);border:1px solid var(--key2);border-radius:8px;padding:6px;font:13px ui-monospace,Menlo,monospace;resize:vertical;-webkit-user-select:text;user-select:text}
#bdcard button{touch-action:auto;padding:5px 10px;font-size:12px}#vzHint{font-size:11px;color:var(--mu);margin-bottom:6px;line-height:1.35}
#brg{position:absolute;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:2}
#brg i{background:var(--mu);border-radius:3px;opacity:.8}
#br.top #brg{left:0;right:0;bottom:0;height:24px;cursor:ns-resize}#br.top #brg i{width:48px;height:5px}
#br.left #brg{top:0;bottom:0;right:0;width:24px;cursor:ew-resize}#br.right #brg{top:0;bottom:0;left:0;width:24px;cursor:ew-resize}
#br.left #brg i,#br.right #brg i{width:5px;height:48px}
#tour{position:fixed;inset:0;z-index:60;display:none;pointer-events:none}#tmask,#tcard{pointer-events:auto}#ty{color:var(--ac);font-weight:600;margin:-4px 0 10px;font-size:13px}#ty.ok{color:var(--ok)}#tmask{position:absolute;inset:0}
#tspot{position:absolute;border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.72);border:2px solid var(--ac);pointer-events:none;display:none}
#tcard{position:absolute;width:min(330px,calc(100vw - 16px));background:#232733;border-radius:12px;padding:14px;box-shadow:0 8px 30px #000c}
#tcard b{font-size:16px}#tcard p{margin:8px 0 12px;font-size:14px;line-height:1.45;color:#d6d6de}
#tcard .tr{display:flex;align-items:center;gap:6px}#tcard .tr span{flex:1;color:var(--mu);font-size:12px}#tcard button{padding:6px 12px;touch-action:auto}
:root{--brs:70}
#bLay,#run{text-align:center}#bLay{min-width:74px}#run{min-width:58px;padding:5px 10px}
.snp{display:none}#snl{grid-area:sl}#snr{grid-area:sr}
#app.stack.sidesn{grid-template-columns:5fr 6fr 8fr 5fr;grid-template-areas:"ed ed ed ed" "sl kl kr sr"}
#app.sidesn .snp{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,var(--kh));gap:3px;align-content:end;align-self:end;-webkit-user-select:none;user-select:none;touch-action:none}
.snp button{display:flex;align-items:center;justify-content:center;min-width:0}
dialog input[type=range]{padding:0;border:0;background:transparent}
</style>
</head>
<body>
<div id="root">
  <div id="top">
    <button class="chip" id="bDrawer">☰</button><span id="fn"></span>
    <span id="tabs"><button class="chip" data-t="code">Code</button><button class="chip" data-t="input">Input</button><button class="chip" data-t="output">Output</button></span>
    <span class="sp"></span>
    <button class="chip" id="bUndo" title="Undo">↶</button><button class="chip" id="bRedo" title="Redo">↷</button>
    <span id="clip"><button class="chip" id="bAll">All</button><button class="chip" id="bCut">Cut</button><button class="chip" id="bCopy">Copy</button><button class="chip" id="bPaste">Paste</button></span>
    <button class="chip" id="bLay"></button><button class="chip" id="bFull" title="Full screen">⛶</button><button class="chip" id="bPanel" title="Problem, notes and board">📝</button><button class="chip" id="bSet">⚙</button><button id="run">▶ Run</button>
    <i class="brk"></i>
  </div>
  <div id="app" class="split">
    <div id="snl" class="snp"></div>
    <div id="kl" class="kb"></div>
    <div id="ed">
      <div id="drawer"></div>
      <div class="pane" id="pCode"></div><div class="pane" id="pIn"></div>
      <div class="pane" id="pOut"><pre id="out"></pre></div>
    </div>
    <div id="kr" class="kb"></div>
    <div id="snr" class="snp"></div>
  </div>
</div>
<dialog id="dNew"><label>New file (.cpp, .java, .py)</label><input id="iNew" autocapitalize="off" autocomplete="off" spellcheck="false"><div class="b"><button id="nNo">Cancel</button><button id="nYes" class="chip on">Create</button></div></dialog>
<dialog id="dMenu"><div id="mTitle" style="margin-bottom:12px;font-weight:600"></div><div class="col"><button id="mRen" class="chip">Rename</button><button id="mDup" class="chip">Duplicate</button><button id="mDel" class="chip" style="color:var(--er)">Delete</button><button id="mNo" class="chip">Close</button></div></dialog>
<dialog id="dRen"><label>Rename file</label><input id="iRen" autocapitalize="off" autocomplete="off" spellcheck="false"><div class="b"><button id="rNo">Cancel</button><button id="rYes" class="chip on">Rename</button></div></dialog>
<dialog id="dSet">
<label>Key size (Split layout): <b id="ksv"></b></label><input id="iKs" type="range" min="40" max="120" step="5">
<label>Key height: <b id="khv"></b></label><input id="iKh" type="range" min="80" max="160" step="5">
<label>Key font size: <b id="kfv"></b></label><input id="iKf" type="range" min="60" max="160" step="5">
<label>Editor font size: <b id="efv"></b></label><input id="iEf" type="range" min="5" max="24" step="1">
<label>Word wrap</label><select id="iWr"><option value="off">Off</option><option value="on">On</option></select>
<label>Problem / Notes / Board panel opens from</label><select id="iBe"><option value="top">Top edge</option><option value="left">Left edge</option><option value="right">Right edge</option></select><label>Snippet rows (Split layout): <b id="srv"></b></label><input id="iSr" type="range" min="0" max="3" step="1">
<label>Snippet font size: <b id="sfv"></b></label><input id="iSf" type="range" min="50" max="220" step="5">
<label>Wide layout: keyboard on</label><select id="iWs"><option value="right">Right half</option><option value="left">Left half</option></select>
<label>Suggestions</label><select id="iSg"><option value="list">List near cursor</option><option value="blocks">Blocks above cursor</option><option value="off">Off</option></select>
<label>Max suggestions: <b id="smv"></b></label><input id="iSm" type="range" min="1" max="10" step="1">
<label>Judge0 server URL</label><input id="iUrl" autocapitalize="off" autocomplete="off">
<label>Auth token (optional)</label><input id="iTok" autocapitalize="off" autocomplete="off">
<button id="sTour" class="chip" style="margin-bottom:12px">Replay the tour</button>
<div class="b"><button id="sNo">Cancel</button><button id="sYes" class="chip on">Save</button></div></dialog>
<div id="br" class="top" data-v="prob">
 <div id="brt"><button class="chip on" data-bt="prob">Problem</button><button class="chip" data-bt="notes">Notes</button><button class="chip" data-bt="board">Board</button><span class="sp2"></span><button class="chip" id="brX" title="Close">✕</button></div>
 <div id="pnbody">
  <div id="pvprob" class="pv"><div id="pcols"></div></div>
  <div id="pvnotes" class="pv">
   <div id="pnTb"><button class="mini" data-a="bold"><b>B</b></button><button class="mini" data-a="italic"><i>I</i></button><button class="mini" data-a="ul">• List</button><button class="mini" data-a="code">&lt;/&gt;</button><span class="sp2"></span><button class="mini" data-a="undo">↶</button><button class="mini" data-a="redo">↷</button><button class="mini" data-a="clear">Clear</button></div>
   <div id="pNotes" class="pe" contenteditable="true" spellcheck="false" data-ph="Your own notes: observations, key points, ideas, edge cases…"></div>
  </div>
  <div id="pvboard" class="pv">
   <div id="bdt"><button class="chip on" data-tool="pen" title="Pen">✎ Pen</button><button class="chip" data-tool="eraser" title="Eraser">⌫ Eraser</button><span id="bdc"></span><button class="chip" id="bdw" title="Pen size">M</button><span class="sp2"></span><button class="chip" id="bdU" title="Undo">↶</button><button class="chip" id="bdR" title="Redo">↷</button><button class="chip" id="bdClr">Clear</button><button class="chip" id="bdViz">Visualize</button></div>
   <div id="bdwrap"><canvas id="bdv"></canvas><canvas id="bdi"></canvas>
    <div id="bdcard"><div class="vrow"><select id="vzT"><option value="array">Array</option><option value="matrix">Matrix / grid</option><option value="tree">Tree</option><option value="graph">Graph</option><option value="wgraph">Weighted graph</option></select><label><input type="checkbox" id="vzD"> Directed</label></div>
     <textarea id="vzI" rows="5" spellcheck="false" autocapitalize="off"></textarea><div id="vzHint"></div>
     <div class="vrow"><button class="chip on" id="vzDraw">Draw</button><button class="chip" id="vzEx">Example</button><button class="chip" id="vzRm">Remove</button><button class="chip" id="vzX">✕</button></div></div>
   </div>
  </div>
