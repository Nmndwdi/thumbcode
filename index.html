 L:[['`~','1!','2@','3#','4$','5%'],

 return p.catch(function(){var ta=document.createElement('textarea');ta.value=s;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(ta);ta.select();
  var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);if(!ok)throw new Error('copy failed')})}
function outSel(){var s=window.getSelection();return s&&!s.isCollapsed&&$('out').contains(s.anchorNode)?s.toString():''}
$('bAll').onclick=function(){
 if(tab==='output'){var r=document.createRange();r.selectNodeContents($('out'));var s=window.getSelection();s.removeAllRanges();s.addRange(r);return}
 ed().execCommand('selectAll');ed().focus()};
$('bCopy').onclick=function(){var s=tab==='output'?(outSel()||$('out').textContent):ed().getSelection();
 if(!s){toast('Select some text first');return}
 copyText(s).then(function(){toast('Copied')},function(){toast('Copy was blocked by the browser')})};
$('bCut').onclick=function(){if(tab==='output'){toast('Output can only be copied');return}
 var cm=ed(),s=cm.getSelection();if(!s){toast('Select some text first');return}
 copyText(s).then(function(){cm.replaceSelection('');cm.focus();toast('Cut')},function(){toast('Cut was blocked by the browser')})};
$('bPaste').onclick=function(){var cm=ed();if(tab==='output')showTab('code');
 if(!navigator.clipboard||!navigator.clipboard.readText){toast('Paste is not available in this browser');return}
 navigator.clipboard.readText().then(function(s){if(!s){toast('Clipboard is empty');return}cm.replaceSelection(s,'end');cm.focus()},function(){toast('Allow clipboard access to paste')})};
['bAll','bCut','bCopy','bPaste'].forEach(function(id){$(id).addEventListener('mousedown',function(e){e.preventDefault()})});
var DISP=[['ks','iKs','ksv','%'],['kh','iKh','khv','%'],['kf','iKf','kfv','%'],['ef','iEf','efv','px'],['sr','iSr','srv',''],['sf','iSf','sfv','%'],['sm','iSm','smv','']];
function applyUI(o){var r=document.documentElement.style;
 r.setProperty('--kw',(60*o.ks/100)+'px');r.setProperty('--kh',(56*o.ks/100*o.kh/100)+'px');r.setProperty('--kf',o.kf/100);r.setProperty('--ef',o.ef+'px');r.setProperty('--sf',o.sf/100);r.setProperty('--sh',(56*o.ks/100*o.kh/100*.78)+'px');SR=o.sr;SGM=o.sg;SMX=o.sm;$('app').classList.toggle('kbleft',o.ws==='left');
 DISP.forEach(function(d){$(d[2]).textContent=o[d[0]]+d[3]});cmCode.refresh();cmIn.refresh();if(typeof STD==='object')render();if(SGM==='off')sgHide()}
function sliders(){var o={};DISP.forEach(function(d){o[d[0]]=+$(d[1]).value});o.ws=$('iWs').value;o.sg=$('iSg').value;return o}
DISP.forEach(function(d){$(d[1]).addEventListener('input',function(){applyUI(sliders())})});
['iWs','iSg'].forEach(function(id){$(id).addEventListener('change',function(){applyUI(sliders())})});
$('bSet').onclick=function(){$('iUrl').value=S.url;$('iTok').value=S.tok;DISP.forEach(function(d){$(d[1]).value=S[d[0]]});$('iWs').value=S.ws;$('iSg').value=S.sg;applyUI(S);$('dSet').showModal()};
$('sNo').onclick=function(){applyUI(S);$('dSet').close()};
$('sYes').onclick=function(){S.url=$('iUrl').value.trim().replace(/\/+$/,'')||'https://ce.judge0.com';S.tok=$('iTok').value.trim();var o=sliders();DISP.forEach(function(d){S[d[0]]=o[d[0]]});S.ws=o.ws;S.sg=o.sg;save();$('dSet').close()};
// ---- Judge0 ----
var idCache={};
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function unb64(s){if(s==null)return '';try{return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}catch(e){return atob(s.replace(/\s/g,''))}}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(S.tok)opt.headers['X-Auth-Token']=S.tok;
 return fetch(S.url+path,opt).then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error('Server said HTTP '+r.status+'. '+t.slice(0,200));return JSON.parse(t)})},
  function(){throw new Error('Could not reach '+S.url+'. Check the internet, or the server may block browser requests (CORS). You can set another server under ⚙.')})}
function verKey(n){var m=/\d+(\.\d+)+/.exec(n);return m?m[0].split('.').map(Number):[0]}
function newer(a,b){for(var i=0;i<Math.max(a.length,b.length);i++){var x=a[i]||0,y=b[i]||0;if(x!==y)return x>y}return false}
function langId(l){if(idCache[S.url])return Promise.resolve(idCache[S.url][l.name]||l.fb);
 return api('/languages').then(function(arr){var m={};Object.keys(LANGS).forEach(function(k){var L=LANGS[k],best=null,id=0;
   arr.forEach(function(o){if(o.name.indexOf(L.pre)===0){var v=verKey(o.name);if(!best||newer(v,best)){best=v;id=o.id}}});if(id)m[L.name]=id});
  idCache[S.url]=m;return m[l.name]||l.fb},function(){return l.fb})}
var running=false;
function line(cls,t){var d=document.createElement('div');d.className=cls;d.textContent=t;return d}
function show(nodes){var o=$('out');o.innerHTML='';nodes.forEach(function(n){o.appendChild(n)})}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
$('run').onclick=function(){if(running)return;var l=langOf(S.cur);if(!l){toast('Unknown file type');return}
 save();running=true;$('run').textContent='Running…';$('run').classList.add('busy');showTab('output');show([line('a','Running…')]);
 langId(l).then(function(id){return api('/submissions?base64_encoded=true&wait=false',{method:'POST',body:JSON.stringify({source_code:b64(S.files[S.cur]),language_id:id,stdin:b64(S.input)})})})
 .then(function(c){var n=0;function poll(){if(n++>90)throw new Error('Timed out waiting for the server.');
   return wait(n<4?600:1000).then(function(){return api('/submissions/'+c.token+'?base64_encoded=true&fields=status,stdout,stderr,compile_output,message,time,memory')}).then(function(r){return r.status.id>2?r:poll()})}
  return poll()})
 .then(function(r){var meta=[r.status.description,r.time!=null?r.time+'s':null,r.memory!=null?r.memory+' KB':null].filter(Boolean).join('  ·  '),nodes=[line(r.status.id===3?'g':'a',meta)];
  if(r.compile_output)nodes.push(line('e',unb64(r.compile_output)));if(r.stdout)nodes.push(line('',unb64(r.stdout)));
  if(r.stderr)nodes.push(line('e',unb64(r.stderr)));if(r.message)nodes.push(line('a',unb64(r.message)));show(nodes)})
 .catch(function(e){show([line('e',e.message||String(e))])})
 .then(function(){running=false;$('run').textContent='▶ Run';$('run').classList.remove('busy')})};
applyUI(S);render();setLay(S.layout);showTab('code');
})();
