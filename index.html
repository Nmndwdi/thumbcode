<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<title>ThumbCode</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
:root{--bg:#111318;--pn:#1b1e25;--key:#2a2e38;--key2:#383d4a;--ac:#5b8cff;--tx:#e8e8ee;--mu:#8b8d99;--ok:#3fb868;--am:#e5a93c;--er:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#root{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;align-items:center;gap:6px;height:36px;padding:0 6px;flex:none}
#top .sp{flex:1}#fn{color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
button{font:inherit;color:var(--tx);background:var(--key);border:0;border-radius:8px;padding:0;cursor:pointer;touch-action:none}
.chip{padding:5px 10px;font-size:13px;white-space:nowrap}.chip.on{background:var(--ac)}
#run{background:var(--ok);color:#000;padding:5px 14px;font-size:13px;font-weight:600}#run.busy{background:var(--am)}
#app{flex:1;min-height:0;display:grid;gap:6px;padding:2px 6px 6px}
#app.split{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"kl ed kr"}
#app.wide{grid-template-columns:2fr 1fr 1fr;grid-template-areas:"ed kl kr"}
#app.stack{grid-template-columns:1fr 1fr;grid-template-rows:1.1fr .9fr;grid-template-areas:"ed ed" "kl kr"}
#app.focus{grid-template-columns:1fr;grid-template-areas:"ed"}
#app.focus .kb{display:none}
#ed{grid-area:ed;position:relative;background:var(--pn);border-radius:10px;overflow:hidden;min-width:0;min-height:0;display:flex;flex-direction:column;-webkit-user-select:text;user-select:text}
#kl{grid-area:kl}#kr{grid-area:kr}
.kb{display:grid;grid-template-rows:repeat(5,1fr);gap:4px;min-height:0;min-width:0;-webkit-user-select:none;user-select:none;touch-action:none}
.row{display:flex;gap:4px;min-height:0}.row button{flex:1;min-width:0;font-size:clamp(14px,3.8vmin,22px)}
.row button.w{flex:2}.row button.s{background:var(--key2);font-size:clamp(11px,2.8vmin,15px)}
.row button.d,.row button.on{background:var(--ac)}
.pane{flex:1;min-height:0;display:none}.pane.show{display:block}
.CodeMirror{height:100%;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:transparent}
.CodeMirror-gutters{background:transparent;border:0}
#out{margin:0;padding:10px;overflow:auto;height:100%;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
#out .m{color:var(--mu)}#out .g{color:var(--ok)}#out .a{color:var(--am)}#out .e{color:var(--er)}#out div{margin-bottom:8px}
#drawer{position:absolute;left:0;top:0;bottom:0;width:190px;background:#232733;padding:6px;display:none;z-index:5;overflow:auto}
#drawer .f{display:flex;align-items:center;padding:8px;border-radius:8px;font-size:14px}.f.cur{background:var(--key2)}.f span{flex:1;overflow:hidden;text-overflow:ellipsis}.f b{color:var(--mu);padding-left:8px}
#drawer .h{color:var(--mu);font-size:11px;padding:4px}#drawer .n{color:var(--ac);padding:8px;font-size:14px}
dialog{background:#232733;color:var(--tx);border:0;border-radius:12px;padding:16px;max-width:90vw;width:340px}
dialog::backdrop{background:#0008}dialog input{width:100%;margin:6px 0 10px;padding:8px;border-radius:8px;border:1px solid var(--key2);background:var(--bg);color:var(--tx);font-size:15px;-webkit-user-select:text;user-select:text}
dialog .b{display:flex;gap:8px;justify-content:flex-end}dialog button{padding:8px 14px;touch-action:auto}dialog label{font-size:12px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:9}
</style>
</head>
<body>
<div id="root">
  <div id="top">
    <button class="chip" id="bDrawer">☰</button><span id="fn"></span>
    <button class="chip" data-t="code">Code</button><button class="chip" data-t="input">Input</button><button class="chip" data-t="output">Output</button>
    <span class="sp"></span>
    <button class="chip" id="bLay"></button><button class="chip" id="bFull" title="Full screen">⛶</button><button class="chip" id="bSet">⚙</button><button id="run">▶ Run</button>
  </div>
  <div id="app" class="split">
    <div id="kl" class="kb"></div>
    <div id="ed">
      <div id="drawer"></div>
      <div class="pane" id="pCode"></div><div class="pane" id="pIn"></div>
      <div class="pane" id="pOut"><pre id="out"></pre></div>
    </div>
    <div id="kr" class="kb"></div>
  </div>
</div>
<dialog id="dNew"><label>New file (.cpp, .java, .py)</label><input id="iNew" autocapitalize="off" autocomplete="off" spellcheck="false"><div class="b"><button id="nNo">Cancel</button><button id="nYes" class="chip on">Create</button></div></dialog>
<dialog id="dSet"><label>Judge0 server URL</label><input id="iUrl" autocapitalize="off" autocomplete="off"><label>Auth token (optional)</label><input id="iTok" autocapitalize="off" autocomplete="off"><div class="b"><button id="sNo">Cancel</button><button id="sYes" class="chip on">Save</button></div></dialog>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var LANGS={
 cpp:{name:'C++',pre:'C++ (GCC',fb:54,mode:'text/x-c++src',tpl:'#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n\n    int n;\n    cin >> n;\n    cout << n * 2 << "\\n";\n    return 0;\n}\n',file:'Main.cpp'},
 java:{name:'Java',pre:'Java (OpenJDK',fb:62,mode:'text/x-java',tpl:'import java.io.*;\nimport java.util.*;\n\n// Judge0 compiles Java as Main.java, so keep the class name Main.\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n        int n = Integer.parseInt(br.readLine().trim());\n        System.out.println(n * 2);\n    }\n}\n',file:'Main.java'},
 py:{name:'Python',pre:'Python (3',fb:71,mode:'python',tpl:'n = int(input())\nprint(n * 2)\n',file:'main.py'}
};
function langOf(n){var m=/\.([a-z]+)$/i.exec(n);return m&&LANGS[m[1].toLowerCase()]?LANGS[m[1].toLowerCase()]:null}
// ---- storage ----
var S={files:null,cur:'Main.cpp',input:'5\n',layout:'split',url:'https://ce.judge0.com',tok:''};
try{var raw=localStorage.getItem('thumbcode.v1');if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
if(!S.files){S.files={};Object.keys(LANGS).forEach(function(k){S.files[LANGS[k].file]=LANGS[k].tpl})}
if(!S.files[S.cur])S.cur=Object.keys(S.files)[0];
if(!localStorage.getItem('thumbcode.v1')&&innerHeight>innerWidth)S.layout='stack';
function save(){S.files[S.cur]=cmCode.getValue();S.input=cmIn.getValue();try{localStorage.setItem('thumbcode.v1',JSON.stringify(S))}catch(e){}}
// ---- editors ----
function mk(host,ln){var cm=CodeMirror($(host),{lineNumbers:ln,theme:'material-darker',indentUnit:4,tabSize:4,indentWithTabs:false,smartIndent:true,electricChars:true});
 cm.getInputField().setAttribute('inputmode','none');cm.getInputField().setAttribute('autocapitalize','off');return cm}
var cmCode=mk('pCode',true),cmIn=mk('pIn',false);
var tab='code';
function act(){return tab==='input'?cmIn:cmCode}
function loadFile(n){S.cur=n;cmCode.setValue(S.files[n]);cmCode.clearHistory();var l=langOf(n);cmCode.setOption('mode',l?l.mode:'text/plain');$('fn').textContent=n;cmCode.setCursor({line:0,ch:0})}
cmIn.setValue(S.input);loadFile(S.cur);
setInterval(save,4000);addEventListener('pagehide',save);document.addEventListener('visibilitychange',save);
// ---- tabs, layout ----
var LAY=['split','wide','stack','focus'];
function showTab(t){tab=t;['code','input','output'].forEach(function(k){$({code:'pCode',input:'pIn',output:'pOut'}[k]).classList.toggle('show',k===t)});
 document.querySelectorAll('[data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
 if(t==='code'){cmCode.refresh();cmCode.focus()}if(t==='input'){cmIn.refresh();cmIn.focus()}}
document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){showTab(b.dataset.t)}});
function setLay(l){S.layout=l;$('app').className=l;$('bLay').textContent='⊞ '+l[0].toUpperCase()+l.slice(1);setTimeout(function(){cmCode.refresh();cmIn.refresh()},50);save()}
$('bLay').onclick=function(){setLay(LAY[(LAY.indexOf(S.layout)+1)%LAY.length])};
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2600)}
$('bFull').onclick=function(){
 var d=document,el=d.documentElement;
 if(d.fullscreenElement){d.exitFullscreen();return}
 if(!el.requestFullscreen){toast('Full screen is not supported here. Use Add to Home Screen.');return}
 el.requestFullscreen().then(function(){if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){})}).catch(function(){toast('Full screen was blocked by the browser.')})};
document.addEventListener('fullscreenchange',function(){setTimeout(function(){cmCode.refresh();cmIn.refresh()},100)});
// ---- keyboard ----
var ABC={L:[['1','2','3','4','5'],['q','w','e','r','t'],['a','s','d','f','g'],['z','x','c','v','b']],R:[['6','7','8','9','0'],['y','u','i','o','p'],['h','j','k','l',';'],['n','m',',','.','_']]};
var SYM={L:[['(',')','{','}','['],['<','>','=','+','-'],['#','%','\\','~','?'],['@','$','`','^',':']],R:[[']',';','"',"'",'&'],['*','/','|','!','.'],['LEFT','UP','DOWN','RIGHT','DEL'],['HOME','END','UNDO','REDO','_']]};
var BOT={L:['SHIFT','SYM','TAB','SPACE'],R:['SPACE','BKSP','ENTER']};
var LBL={SHIFT:'⇧',TAB:'Tab',SPACE:'space',BKSP:'⌫',DEL:'⌦',ENTER:'⏎',LEFT:'←',RIGHT:'→',UP:'↑',DOWN:'↓',HOME:'⇤',END:'⇥',UNDO:'↶',REDO:'↷'};
var REP={BKSP:1,DEL:1,LEFT:1,RIGHT:1,UP:1,DOWN:1};
var shift=false,sym=false;
function build(side,el){var rows=(sym?SYM:ABC)[side],h='';
 function btn(k,cls){var t=k.length>1?(k==='SYM'?(sym?'ABC':'#+='):LBL[k]):(shift&&/[a-z]/.test(k)?k.toUpperCase():k);
  var c=(cls||'')+(k.length>1?' s':'')+((k==='SHIFT'&&shift)||(k==='SYM'&&sym)?' on':'');
  return '<button class="'+c+'" data-k="'+k.replace(/"/g,'&quot;')+'">'+t+'</button>'}
 rows.forEach(function(r){h+='<div class="row">'+r.map(function(k){return btn(k)}).join('')+'</div>'});
 h+='<div class="row">'+BOT[side].map(function(k){return btn(k,k==='SPACE'?'w':'')}).join('')+'</div>';el.innerHTML=h}
function render(){build('L',$('kl'));build('R',$('kr'))}
var PAIR={'(':')','[':']','{':'}','"':'"',"'":"'"},CLOSE=')]}"\'';
function smart(){return act()===cmCode}
function typeChar(c){var cm=act();
 if(smart()&&!cm.somethingSelected()){var cur=cm.getCursor(),ln=cm.getLine(cur.line),nx=ln.charAt(cur.ch),pv=ln.charAt(cur.ch-1);
  if(CLOSE.indexOf(c)>=0&&nx===c){cm.setCursor({line:cur.line,ch:cur.ch+1});return}
  if(PAIR[c]&&!((c==='"'||c==="'")&&/[A-Za-z0-9]/.test(pv))){cm.replaceSelection(c+PAIR[c]);cm.setCursor({line:cur.line,ch:cur.ch+1});return}}
 cm.replaceSelection(c,'end')}
function bksp(){var cm=act();if(cm.somethingSelected()){cm.replaceSelection('');return}
 var cur=cm.getCursor(),ln=cm.getLine(cur.line),p=ln.charAt(cur.ch-1),n=ln.charAt(cur.ch);
 if(smart()&&cur.ch>0&&PAIR[p]&&PAIR[p]===n){cm.replaceRange('',{line:cur.line,ch:cur.ch-1},{line:cur.line,ch:cur.ch+1});return}
 if(smart()&&cur.ch>=4&&cur.ch%4===0&&ln.slice(0,cur.ch).trim()===''){cm.replaceRange('',{line:cur.line,ch:cur.ch-4},cur);return}
 cm.execCommand('delCharBefore')}
function enter(){var cm=act();if(!smart()){cm.replaceSelection('\n','end');return}
 var cur=cm.getCursor(),ln=cm.getLine(cur.line),b=ln.slice(0,cur.ch),a=ln.slice(cur.ch);
 if(/\{$/.test(b)&&/^\}/.test(a)){cm.replaceSelection('\n\n','end');var l=cur.line;cm.indentLine(l+1,'smart');cm.indentLine(l+2,'smart');cm.setCursor({line:l+1,ch:cm.getLine(l+1).length})}
 else cm.execCommand('newlineAndIndent')}
function press(k){var cm=act();
 if(k==='SHIFT'){shift=!shift;render();return}
 if(k==='SYM'){sym=!sym;render();return}
 if(tab==='output'){showTab('code');cm=act()}
 if(!cm.hasFocus())cm.focus();
 if(navigator.vibrate)navigator.vibrate(6);
 switch(k){
  case 'TAB':cm.replaceSelection('    ','end');break;
  case 'SPACE':cm.replaceSelection(' ','end');break;
  case 'BKSP':bksp();break;case 'DEL':cm.execCommand('delCharAfter');break;
  case 'ENTER':enter();break;
  case 'LEFT':cm.execCommand('goCharLeft');break;case 'RIGHT':cm.execCommand('goCharRight');break;
  case 'UP':cm.execCommand('goLineUp');break;case 'DOWN':cm.execCommand('goLineDown');break;
  case 'HOME':cm.execCommand('goLineStartSmart');break;case 'END':cm.execCommand('goLineEnd');break;
  case 'UNDO':cm.undo();break;case 'REDO':cm.redo();break;
  default:var c=k;if(shift&&/[a-z]/.test(k)){c=k.toUpperCase();shift=false;render()}typeChar(c)}}
var holds={};
function stopHold(id){var h=holds[id];if(h){clearTimeout(h.t);clearInterval(h.i);delete holds[id]}}
['kl','kr'].forEach(function(id){var el=$(id);
 el.addEventListener('pointerdown',function(e){var b=e.target.closest('button');if(!b)return;e.preventDefault();
  var k=b.getAttribute('data-k');b.classList.add('d');press(k);
  if(REP[k]){var h=holds[e.pointerId]={};h.t=setTimeout(function(){h.i=setInterval(function(){press(k)},55)},350)}});
 function up(e){var b=e.target.closest&&e.target.closest('button');if(b)b.classList.remove('d');stopHold(e.pointerId)}
 ['pointerup','pointercancel','pointerleave'].forEach(function(n){el.addEventListener(n,up)});
 el.addEventListener('mousedown',function(e){e.preventDefault()});el.addEventListener('contextmenu',function(e){e.preventDefault()})});
// ---- files ----
function drawer(){var d=$('drawer'),h='<div class="h">FILES</div>';
 Object.keys(S.files).sort().forEach(function(n){h+='<div class="f'+(n===S.cur?' cur':'')+'" data-f="'+n+'"><span>'+n+'</span>'+(Object.keys(S.files).length>1?'<b data-x="'+n+'">✕</b>':'')+'</div>'});
 d.innerHTML=h+'<div class="n" data-new="1">+ New file</div>'}
$('bDrawer').onclick=function(){var d=$('drawer');drawer();d.style.display=d.style.display==='block'?'none':'block'};
$('drawer').addEventListener('click',function(e){var t=e.target;
 if(t.dataset.x){delete S.files[t.dataset.x];if(S.cur===t.dataset.x)loadFile(Object.keys(S.files)[0]);drawer();save();return}
 if(t.dataset.new){$('iNew').value='';$('dNew').showModal();return}
 var f=t.closest('.f');if(f){save();loadFile(f.dataset.f);$('drawer').style.display='none';showTab('code')}});
$('nNo').onclick=function(){$('dNew').close()};
$('nYes').onclick=function(){var n=$('iNew').value.trim();if(!n)return;if(n.indexOf('.')<0)n+='.cpp';
 if(!/^[A-Za-z0-9._-]+$/.test(n)||!langOf(n)){toast('Use letters/digits and .cpp .java .py');return}
 if(S.files[n]){toast('That file exists');return}
 save();S.files[n]=langOf(n).tpl;loadFile(n);$('dNew').close();$('drawer').style.display='none';showTab('code');save()};
$('bSet').onclick=function(){$('iUrl').value=S.url;$('iTok').value=S.tok;$('dSet').showModal()};
$('sNo').onclick=function(){$('dSet').close()};
$('sYes').onclick=function(){S.url=$('iUrl').value.trim().replace(/\/+$/,'')||'https://ce.judge0.com';S.tok=$('iTok').value.trim();save();$('dSet').close()};
// ---- Judge0 ----
var idCache={};
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function unb64(s){if(s==null)return '';try{return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}catch(e){return atob(s.replace(/\s/g,''))}}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(S.tok)opt.headers['X-Auth-Token']=S.tok;
 return fetch(S.url+path,opt).then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error('Server said HTTP '+r.status+'. '+t.slice(0,200));return JSON.parse(t)})},
  function(){throw new Error('Could not reach '+S.url+'. Check the internet, or the server may block browser requests (CORS). You can set another server under ⚙.')})}
function verKey(n){var m=/\d+(\.\d+)+/.exec(n);return m?m[0].split('.').map(Number):[0]}
function newer(a,b){for(var i=0;i<Math.max(a.length,b.length);i++){var x=a[i]||0,y=b[i]||0;if(x!==y)return x>y}return false}
function langId(l){if(idCache[S.url])return Promise.resolve(idCache[S.url][l.name]||l.fb);
 return api('/languages').then(function(arr){var m={};Object.keys(LANGS).forEach(function(k){var L=LANGS[k],best=null,id=0;
   arr.forEach(function(o){if(o.name.indexOf(L.pre)===0){var v=verKey(o.name);if(!best||newer(v,best)){best=v;id=o.id}}});if(id)m[L.name]=id});
  idCache[S.url]=m;return m[l.name]||l.fb},function(){return l.fb})}
var running=false;
function line(cls,t){var d=document.createElement('div');d.className=cls;d.textContent=t;return d}
function show(nodes){var o=$('out');o.innerHTML='';nodes.forEach(function(n){o.appendChild(n)})}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
$('run').onclick=function(){if(running)return;var l=langOf(S.cur);if(!l){toast('Unknown file type');return}
 save();running=true;$('run').textContent='Running…';$('run').classList.add('busy');showTab('output');show([line('a','Running…')]);
 langId(l).then(function(id){return api('/submissions?base64_encoded=true&wait=false',{method:'POST',body:JSON.stringify({source_code:b64(S.files[S.cur]),language_id:id,stdin:b64(S.input)})})})
 .then(function(c){var n=0;function poll(){if(n++>90)throw new Error('Timed out waiting for the server.');
   return wait(n<4?600:1000).then(function(){return api('/submissions/'+c.token+'?base64_encoded=true&fields=status,stdout,stderr,compile_output,message,time,memory')}).then(function(r){return r.status.id>2?r:poll()})}
  return poll()})
 .then(function(r){var meta=[r.status.description,r.time!=null?r.time+'s':null,r.memory!=null?r.memory+' KB':null].filter(Boolean).join('  ·  '),nodes=[line(r.status.id===3?'g':'a',meta)];
  if(r.compile_output)nodes.push(line('e',unb64(r.compile_output)));if(r.stdout)nodes.push(line('',unb64(r.stdout)));
  if(r.stderr)nodes.push(line('e',unb64(r.stderr)));if(r.message)nodes.push(line('a',unb64(r.message)));show(nodes)})
 .catch(function(e){show([line('e',e.message||String(e))])})
 .then(function(){running=false;$('run').textContent='▶ Run';$('run').classList.remove('busy')})};
render();setLay(S.layout);showTab('code');
})();
</script>
</body>
</html>
